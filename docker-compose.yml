name: rivetlink-server

# RivetLink relay server — production deployment stack.
#
# Core services (always on):  postgres, redis, relay
# Optional profiles:
#   --profile tls    adds an nginx reverse proxy terminating HTTPS/WSS on 443
#   --profile turn   adds a coturn TURN server for NAT traversal (future P2P)
#
# All secrets and tunables live in `.env` (generate it with ./install.sh).

services:
  postgres:
    image: postgres:16
    container_name: rivetlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rivet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (run ./install.sh)}
      POSTGRES_DB: rivet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host — only the relay (same compose network) needs it.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivet -d rivet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rivetlink-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", "60", "1"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  relay:
    # Published image (CI pushes on tag). To run a locally built binary instead,
    # set RELAY_IMAGE in .env to your local tag, e.g.
    #   docker build -f docker/Dockerfile.relay -t rivetlink-relay:local .   (in the main RivetLink repo)
    #   RELAY_IMAGE=rivetlink-relay:local
    image: ${RELAY_IMAGE:-gtheunissen/rivetlink-relay:latest}
    container_name: rivetlink-relay
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Assembled from POSTGRES_PASSWORD so the password lives in exactly one place.
      DATABASE_URL: postgres://rivet:${POSTGRES_PASSWORD}@postgres:5432/rivet
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (run ./install.sh)}
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
      ACCESS_TOKEN_EXPIRY_SECS: ${ACCESS_TOKEN_EXPIRY_SECS:-900}
      REFRESH_TOKEN_EXPIRY_SECS: ${REFRESH_TOKEN_EXPIRY_SECS:-604800}
      MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-5}
      LOCKOUT_DURATION_SECS: ${LOCKOUT_DURATION_SECS:-900}
      HEARTBEAT_INTERVAL_SECS: ${HEARTBEAT_INTERVAL_SECS:-10}
      DISCONNECT_TIMEOUT_SECS: ${DISCONNECT_TIMEOUT_SECS:-30}
      RECONNECT_GRACE_SECS: ${RECONNECT_GRACE_SECS:-15}
    # Direct exposure for plain-HTTP / LAN use. Behind the tls profile you can
    # drop this and let nginx be the only public entry point.
    ports:
      - "${RELAY_PORT:-8080}:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: rivetlink-nginx
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - relay
    environment:
      # Only DOMAIN is substituted into the template; nginx's own $vars are left alone.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env to use the tls profile}
      NGINX_ENVSUBST_FILTER: "DOMAIN"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro

  coturn:
    image: coturn/coturn:4.6.3
    container_name: rivetlink-coturn
    restart: unless-stopped
    profiles: ["turn"]
    # host networking so the TURN relay port range is reachable without per-port maps.
    network_mode: host
    volumes:
      # Rendered by ./install.sh --with-turn (random secret, realm from DOMAIN).
      - ./coturn/turnserver.local.conf:/etc/coturn/turnserver.conf:ro

volumes:
  postgres_data:
