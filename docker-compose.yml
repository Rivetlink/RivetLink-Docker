name: rivetlink-server

# RivetLink relay server — production deployment stack.
#
#   caddy     public HTTPS/WSS on 80/443, automatic Let's Encrypt certificate
#   relay     the RivetLink relay (not published; only Caddy reaches it)
#   postgres  accounts, devices, audit log (not published)
#   coturn    optional, --profile turn: STUN for direct peer-to-peer connections
#
# All secrets and tunables live in `.env` (generate it with ./install.sh).

services:
  postgres:
    image: postgres:16
    container_name: rivetlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rivet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (run ./install.sh)}
      POSTGRES_DB: rivet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host — only the relay (same compose network) needs it.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivet -d rivet"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Memory ceilings keep one runaway container from taking the whole VPS;
    # together they fit the 1 GB minimum.
    mem_limit: 256m

  relay:
    # Published image (CI pushes on tag). To run a locally built binary instead,
    # set RELAY_IMAGE in .env to your local tag, e.g.
    #   docker build -f docker/Dockerfile.relay -t rivetlink-relay:local .   (in the main RivetLink repo)
    #   RELAY_IMAGE=rivetlink-relay:local
    image: ${RELAY_IMAGE:-gtheunissen/rivetlink-relay:0.1.108}
    container_name: rivetlink-relay
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Assembled from POSTGRES_PASSWORD so the password lives in exactly one place.
      DATABASE_URL: postgres://rivet:${POSTGRES_PASSWORD}@postgres:5432/rivet
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (run ./install.sh)}
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
      ACCESS_TOKEN_EXPIRY_SECS: ${ACCESS_TOKEN_EXPIRY_SECS:-900}
      REFRESH_TOKEN_EXPIRY_SECS: ${REFRESH_TOKEN_EXPIRY_SECS:-604800}
      MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-5}
      LOCKOUT_DURATION_SECS: ${LOCKOUT_DURATION_SECS:-900}
      HEARTBEAT_INTERVAL_SECS: ${HEARTBEAT_INTERVAL_SECS:-10}
      DISCONNECT_TIMEOUT_SECS: ${DISCONNECT_TIMEOUT_SECS:-30}
      RECONNECT_GRACE_SECS: ${RECONNECT_GRACE_SECS:-15}
      # host:port of the STUN server (coturn). Set by ./install.sh --with-turn;
      # empty means every session stays on the relay.
      STUN_SERVER: ${STUN_SERVER:-}
      # Days audit log rows are kept; 0 keeps them forever.
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
    # Not published: Docker's published ports bypass ufw, so Caddy is the
    # only way in.
    expose:
      - "8080"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  caddy:
    image: caddy:2.11.7-alpine
    container_name: rivetlink-caddy
    restart: unless-stopped
    depends_on:
      - relay
    mem_limit: 128m
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (run ./install.sh --domain ...)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (run ./install.sh --email ...)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  coturn:
    image: coturn/coturn:4.6.3
    container_name: rivetlink-coturn
    restart: unless-stopped
    profiles: ["turn"]
    # host networking so the TURN relay port range is reachable without per-port maps.
    network_mode: host
    volumes:
      # Rendered by ./install.sh --with-turn (random secret, realm from DOMAIN).
      - ./coturn/turnserver.local.conf:/etc/coturn/turnserver.conf:ro

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
