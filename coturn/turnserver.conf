# RivetLink TURN server (coturn) — OPTIONAL.
#
# RivetLink uses it as a STUN server, so the apps can find a direct
# peer-to-peer path instead of sending everything through the relay. Without
# it every session simply stays on the relay. Enable with
# ./install.sh --with-turn and open UDP 3478 in your firewall.
#
# This file is a TEMPLATE. `./install.sh --with-turn` renders it into
# coturn/turnserver.local.conf (gitignored) with a random static-auth-secret
# (stored as TURN_SECRET in .env) and realm=$DOMAIN; compose mounts that file.
# Edit this template for other settings, e.g. external-ip for hosts behind NAT,
# then re-run ./install.sh --with-turn.

listening-port=3478
tls-listening-port=5349

# Ephemeral, time-limited credentials derived from a shared secret (WebRTC-friendly).
use-auth-secret
static-auth-secret=GENERATED_BY_INSTALL_SH

realm=relay.example.com

# Public IP of this host (uncomment & set for production behind NAT):
# external-ip=203.0.113.10

# Relay port range for media.
min-port=49152
max-port=65535

fingerprint
no-cli
log-file=stdout
