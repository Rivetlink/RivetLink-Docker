# FerrumLink TURN server (coturn) — OPTIONAL.
#
# Only needed once WebRTC P2P lands; today all media relays through the server,
# so you can ignore this unless you're testing NAT traversal. Enable with:
#   docker compose --profile turn up -d
#
# Before going to production:
#   1. set `realm` to your domain
#   2. replace the static-auth-secret below with a strong random value
#      (openssl rand -hex 32) and hand the same secret to the relay/app config
#   3. set external-ip to this host's public IP

listening-port=3478
tls-listening-port=5349

# Ephemeral, time-limited credentials derived from a shared secret (WebRTC-friendly).
use-auth-secret
static-auth-secret=REPLACE_WITH_openssl_rand_hex_32

realm=relay.example.com

# Public IP of this host (uncomment & set for production behind NAT):
# external-ip=203.0.113.10

# Relay port range for media.
min-port=49152
max-port=65535

fingerprint
no-cli
log-file=stdout
